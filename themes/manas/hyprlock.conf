# Theme-specific hyprlock settings for manas theme
# These override the base settings in ~/.config/hypr/hyprlock.conf

# INPUT FIELD COLORS
input-field {
    outer_color = rgba(137, 180, 250, 0.0)  # accent color, transparent
    inner_color = rgba(13, 13, 15, 0.2)      # background color
    font_color = rgba(205, 214, 244, 1.0)    # foreground color
    check_color = rgba(137, 180, 250, 0.2)   # accent color, 20% opacity
}

# DATE LABEL
label {
    color = rgba(205, 214, 244, 0.75)  # foreground color, 75% opacity
}

# TIME LABEL
label {
    color = rgba(205, 214, 244, 0.75)  # foreground color, 75% opacity
}
